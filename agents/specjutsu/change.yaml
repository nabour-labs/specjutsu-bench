# change, as in steps/specjutsu/change.yaml: sj-propose, then sj-apply (which goes on to
# sj-verify), then sj-finish, all in the main session. Layer 1's sessions 2 to 4 are the
# implementer, task reviewer and whole-change reviewer subagents that sj-apply starts itself
# (SKILL.md#L29-L34, #L43-L46, #L101-L104); in a real run Claude Code starts them inside the
# /sj-apply call, so they are not user sessions and get no `session` entry here. Every prompt
# after the first resumes the main session, as layer 1 comes back to session 1; layer 1's
# session 1 needs no entry, since the first prompt starts a new session.
#
# Assumption: this is fair only if those subagents' turns are counted. The runner counts the
# stream-json lines that carry a `parent_tool_use_id` (scenario AGENT-024); the first real run
# must confirm Claude Code prints the subagents' turns that way.
prompts:
  - prompt: "/sj-propose Raise the free-shipping threshold from $50.00 to $100.00 of discounted subtotal."
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L1-L4
    note: >-
      The task's direction is agreed, sj-propose's trigger (its description). The skill is invoked
      by name, as Claude Code runs a project skill typed as /<name>
      (https://code.claude.com/docs/en/skills); specjutsu's docs name the skills but give no
      prompt wording. sj-explore is skipped, as in layer 1.
  - prompt: /sj-apply
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L1-L4
    note: >-
      Implementing the change's tasks. sj-propose ends by showing the user the proposal and
      scenarios (SKILL.md#L87-L89) and asks for no answer, so the shortest next prompt is the
      skill name alone. sj-apply ends with "continue with `sj-verify`" (#L106) in the same call.
  - prompt: /sj-finish archive the change
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L1-L4
    note: >-
      Landing the change. "archive the change" is one of the triggers in the skill's description,
      and is what layer 1 runs: verify, archive and validate (#L20-L40). The workspace has no
      remote, so the PR steps (#L42-L50) are left out, as layer 1 leaves them out.
