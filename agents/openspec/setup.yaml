# OpenSpec 2.1.1 and Superpowers 7.0.2 into the run's workspace. OpenSpec: the README's installer,
# pinned, then `openspec init` for Claude Code. Superpowers: the Claude Code plugin, installed at
# user scope, which is the run's CLAUDE_CONFIG_DIR, exactly as in agents/speckit/setup.yaml.
steps:
  - command: curl -fsSL https://openspec.dev/cli/install.sh | OPENSPEC_VERSION=v2.1.1 sh
    source: openspec@2.1.1:docs-lab/start/installation.md#L132-L141
    note: >-
      The README's macOS and Linux installer (README.md#L120-L124), pinned with
      `OPENSPEC_VERSION` as the install options say. It installs `openspec` into ~/.local/bin;
      OpenSpec's skills run the `openspec` CLI, so ~/.local/bin must be on the runner's PATH for
      the claude calls. The npm and Homebrew installs are the README's alternatives and are not
      used.
  - command: '"$HOME/.local/bin/openspec" init --scope project --tools claude'
    source: openspec@2.1.1:docs-lab/start/setup.md#L21
    note: >-
      The docs' own form for setup scripts: "If your script commits skills for teammates or CI,
      use `openspec init --scope project --tools claude`". `--tools claude` skips the picker
      (docs-lab/reference/cli.md#L107). Project scope writes the six core-profile skills into the
      workspace (.agents/skills/, linked from .claude/skills/). The default global scope would
      write them under $HOME (~/.agents/skills/, ~/.claude/skills/); with CLAUDE_CONFIG_DIR set,
      Claude Code reads user skills from $CLAUDE_CONFIG_DIR/skills instead, so globally installed
      skills would likely never load. Profile: the core six (propose, explore, apply, update,
      sync, archive; docs-lab/reference/configuration/config-json.md#L24). A smaller `custom`
      profile with only the workflows the prompts use (propose, apply, archive, and sync for
      archive's inline sync), the analogue of Spec Kit's `--no-model-invocation`, was considered
      under the fairness rule but has no documented headless route: `profile custom` installs
      the saved `workflows` list (config-json.md#L13-L15, #L30-L32; cli.md#L110), and the docs
      set that list only through the interactive picker (docs-lab/customize/profiles.md#L35-L41).
      `openspec config set` documents strings, booleans and numbers (cli.md#L335-L347) and no
      list syntax, and no environment variable names the workflows. The pinned source's
      `config set` also parses a JSON array (src/core/config-schema.ts#L262-L265), but that is
      undocumented, as is hand-writing config.json, so `core` stays. Called
      by its full path so setup doesn't depend on ~/.local/bin being on PATH already.
  - command: claude plugin marketplace add https://github.com/obra/superpowers.git#v7.0.2
    source: superpowers@7.0.2:README.md#L68-L76
    note: >-
      As in agents/speckit/setup.yaml: the repository's own marketplace (`superpowers-dev`) at
      tag v7.0.2, so the installed plugin is 7.0.2; the README's marketplaces serve their latest.
      `claude plugin marketplace add` is the non-interactive form of `/plugin marketplace add`
      (https://code.claude.com/docs/en/plugin-marketplaces).
  - command: claude plugin install superpowers@superpowers-dev
    source: superpowers@7.0.2:README.md#L78-L82
    note: >-
      `/plugin install superpowers@<marketplace>` in its CLI form; the default user scope installs
      it into CLAUDE_CONFIG_DIR.
