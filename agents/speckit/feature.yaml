# feature, as in steps/speckit/feature.yaml: the quickstart's shorter path, /speckit-specify,
# /speckit-plan, /speckit-tasks, /speckit-implement, /speckit-converge, one at a time in one chat.
# Layer 1 has no session step (no Spec Kit or Superpowers doc says to start a fresh session), so
# there is no `session` entry. Claude Code invokes the installed skills as /speckit-<command>
# (docs/integrations/claude.md#L22-L24).
prompts:
  - prompt: "/speckit-specify Add payment terms to invoices (due on receipt, net 15, net 30) and a dueDate function that works out when an invoice is due. Put them in a new src/terms.ts that exports a PaymentTerms type, \"due-on-receipt\" | \"net-15\" | \"net-30\", and dueDate(invoice), which returns the due date as YYYY-MM-DD; an invoice without terms is due on its issue date. createInvoice takes an optional terms field and throws InvoiceError(\"invoice <id>: unknown payment terms <terms>\") for any other value."
    source: speckit@1.4.3:docs/quickstart.md#L32-L38
    note: >-
      Step 1 of the shorter path. /speckit-constitution, once per project before either path
      (#L29-L30), is skipped as in layer 1.
  - prompt: /speckit-plan
    source: speckit@1.4.3:docs/quickstart.md#L32-L38
    note: >-
      No arguments: the command's user input is optional ("if not empty",
      templates/commands/plan.md#L16-L22). The quickstart's example adds a tech stack; the
      fixture already has one, so the shortest prompt is the command alone.
  - prompt: /speckit-tasks
    source: speckit@1.4.3:docs/quickstart.md#L32-L38
  - prompt: /speckit-implement
    source: speckit@1.4.3:docs/quickstart.md#L32-L38
  - prompt: /speckit-converge
    source: speckit@1.4.3:docs/quickstart.md#L32-L38
