# Spec Kit 1.4.3 + Superpowers 7.0.2: add payment terms (feature).
# Path: the quickstart's shorter path for smaller features, /speckit-specify, /speckit-plan,
# /speckit-tasks, /speckit-implement, /speckit-converge (speckit@1.4.3:docs/quickstart.md).
# Superpowers' test-driven-development and verification-before-completion skills apply while
# implementing. No Spec Kit or Superpowers doc says to start a fresh session or clear context
# between these commands (the quickstart invokes each one "in its chat, one at a time"), so the
# task is one session.
#
# Workspace: the replay starts from the plain fixture, without the files `specify init` writes
# (.specify/scripts, .specify/templates, .specify/memory/constitution.md). Each command's setup
# script therefore can't run; where its output is a template, the template is loaded from the
# pinned install instead, and the short JSON of paths it also prints is left out (it would only
# add to Spec Kit's count). With no .specify/extensions.yml and no constitution in the workspace,
# every hook check and every "IF EXISTS: Load /memory/constitution.md" is skipped: the smallest
# reading, since /speckit-constitution is a once-per-project step done before either path and
# `specify init` would otherwise leave the unfilled constitution template there.
steps:
  # /speckit-specify
  - kind: load
    tool: speckit
    path: templates/commands/specify.md
    source: speckit@1.4.3:docs/quickstart.md
    note: >-
      /speckit-specify. The Claude integration installs this template as
      .claude/skills/speckit-specify/SKILL.md (docs/integrations/claude.md); the pinned template
      is counted. Superpowers' brainstorming skill is not loaded: the user invoked Spec Kit's
      specify, and using-superpowers puts direct user instructions ahead of skills.
  - kind: load
    tool: speckit
    path: templates/spec-template.md
    source: speckit@1.4.3:templates/commands/specify.md
    note: >-
      Stands in for `scripts/bash/resolve-template.sh spec-template --json`, whose JSON carries
      this template as TEMPLATE_CONTENT. The script is not in the workspace (it is installed by
      `specify init`), so the template is counted without its JSON wrapping, a lower bound.
  - kind: write
    path: specs/001-payment-terms/spec.md
    source: speckit@1.4.3:templates/commands/specify.md
    note: >-
      Step 3 writes TEMPLATE_CONTENT to spec.md and step 7 replaces it with the filled spec; only
      the final spec is counted, once. No codebase file is read first: the template asks for the
      what and why only.
  - kind: write
    path: .specify/feature.json
    source: speckit@1.4.3:templates/commands/specify.md
    note: Step 3 persists the feature directory for the later commands.
  - kind: write
    path: specs/001-payment-terms/checklists/requirements.md
    source: speckit@1.4.3:templates/commands/specify.md
    note: >-
      Step 8a, the spec quality checklist, with its items given inline in the command, so the
      checklist template is not loaded. All items pass on the first validation, so the spec is
      not rewritten.

  # /speckit-plan
  - kind: load
    tool: speckit
    path: templates/commands/plan.md
    source: speckit@1.4.3:docs/quickstart.md
    note: /speckit-plan.
  - kind: load
    tool: speckit
    path: templates/plan-template.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: >-
      Step 2, "Load IMPL_PLAN template (already copied)": `scripts/bash/setup-plan.sh --json`
      copies this template to plan.md and prints a short JSON of paths. The script is not in the
      workspace, so the template is loaded from the pinned install and the JSON is left out.
  - kind: read
    path: specs/001-payment-terms/spec.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: >-
      Step 2, "Read FEATURE_SPEC". The constitution is absent. Smallest reading for the
      Technical Context: no codebase file is read, since the template names none.
  - kind: write
    path: specs/001-payment-terms/research.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: Phase 0. No research agents are dispatched; there are no NEEDS CLARIFICATION items.
  - kind: write
    path: specs/001-payment-terms/data-model.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: Phase 1, step 1, from the spec's key entities.
  - kind: write
    path: specs/001-payment-terms/contracts/terms.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: >-
      Phase 1, step 2: the project is a library, and "public APIs for libraries" is the
      template's own example of an external interface. One contract file for the new API.
  - kind: write
    path: specs/001-payment-terms/quickstart.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: Phase 1, step 3.
  - kind: write
    path: specs/001-payment-terms/plan.md
    source: speckit@1.4.3:templates/commands/plan.md
    note: Step 3 fills the copied template; one write of the final plan.

  # /speckit-tasks
  - kind: load
    tool: speckit
    path: templates/commands/tasks.md
    source: speckit@1.4.3:docs/quickstart.md
    note: /speckit-tasks.
  - kind: load
    tool: speckit
    path: templates/tasks-template.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: >-
      Stands in for `scripts/bash/setup-tasks.sh --json`, whose JSON carries this template as
      TASKS_TEMPLATE_CONTENT. The script is not in the workspace; the template is counted
      without its JSON wrapping, a lower bound.
  - kind: read
    path: specs/001-payment-terms/plan.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: Step 2, required design document.
  - kind: read
    path: specs/001-payment-terms/spec.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: Step 2, required design document.
  - kind: read
    path: specs/001-payment-terms/data-model.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: Step 2, optional document, present.
  - kind: read
    path: specs/001-payment-terms/contracts/terms.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: Step 2, optional document (contracts/), present.
  - kind: read
    path: specs/001-payment-terms/research.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: Step 2, optional document, present.
  - kind: read
    path: specs/001-payment-terms/quickstart.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: Step 2, optional document, present.
  - kind: write
    path: specs/001-payment-terms/tasks.md
    source: speckit@1.4.3:templates/commands/tasks.md
    note: >-
      Step 4. Test tasks are included because the TDD approach is requested (Superpowers'
      test-driven-development). The golden file already has every task marked [X]: /speckit-
      implement's later edit from [ ] to [X] keeps the byte count, so it is not written again.

  # /speckit-implement
  - kind: load
    tool: speckit
    path: templates/commands/implement.md
    source: speckit@1.4.3:docs/quickstart.md
    note: >-
      /speckit-implement. `scripts/bash/check-prerequisites.sh --json --require-tasks
      --include-tasks` prints only paths and is not in the workspace; left out.
  - kind: read
    path: specs/001-payment-terms/checklists/requirements.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 2, checklist gate. All items are checked, so implementation proceeds.
  - kind: read
    path: specs/001-payment-terms/tasks.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 3, required.
  - kind: read
    path: specs/001-payment-terms/plan.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 3, required.
  - kind: read
    path: specs/001-payment-terms/data-model.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 3, if exists.
  - kind: read
    path: specs/001-payment-terms/contracts/terms.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 3, if exists.
  - kind: read
    path: specs/001-payment-terms/research.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 3, if exists.
  - kind: read
    path: specs/001-payment-terms/quickstart.md
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 3, if exists.
  - kind: run
    command: git rev-parse --git-dir 2>/dev/null
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 4, the command the template gives to detect a git repository.
  - kind: write
    path: .gitignore
    source: speckit@1.4.3:templates/commands/implement.md
    note: >-
      Step 4: a git repo with no .gitignore, so one is created with the Node.js/TypeScript and
      Universal patterns. No .npmignore: package.json is private, not published. No other
      ignore file applies.
  - kind: load
    tool: superpowers
    path: skills/test-driven-development/SKILL.md
    source: superpowers@7.0.2:skills/using-superpowers/SKILL.md
    note: >-
      "Invoke relevant or requested skills BEFORE any response or action"; the skill's
      description is "Use when implementing any feature or bugfix, before writing implementation
      code". Spec Kit's implement also says "Follow TDD approach".
  - kind: load
    tool: superpowers
    path: skills/test-driven-development/writing-good-tests.md
    source: superpowers@7.0.2:skills/test-driven-development/SKILL.md
    note: '"When writing or changing any test, read writing-good-tests.md".'
  - kind: write
    path: test/terms.test.ts
    source: superpowers@7.0.2:skills/test-driven-development/SKILL.md
    note: >-
      RED: tasks T001 and T005. Both stories' tests live in one file, so the golden file is
      written once rather than in two increments.
  - kind: run
    command: npx vitest run test/terms.test.ts
    source: superpowers@7.0.2:skills/test-driven-development/SKILL.md
    note: Verify RED, the targeted run; it fails because src/terms.ts does not exist yet.
  - kind: read
    path: src/invoice.ts
    source: speckit@1.4.3:templates/commands/implement.md
    note: >-
      Step 6, executing T003 and T006: the file is read before it is edited. Only files the
      tasks edit are read; no other source or test file.
  - kind: read
    path: src/index.ts
    source: speckit@1.4.3:templates/commands/implement.md
    note: Step 6, executing T004; read before it is edited.
  - kind: write
    path: src/terms.ts
    source: speckit@1.4.3:templates/commands/implement.md
    note: GREEN, task T002.
  - kind: write
    path: src/invoice.ts
    source: speckit@1.4.3:templates/commands/implement.md
    note: GREEN, tasks T003 and T006, written once in their final form.
  - kind: write
    path: src/index.ts
    source: speckit@1.4.3:templates/commands/implement.md
    note: GREEN, task T004.
  - kind: load
    tool: superpowers
    path: skills/verification-before-completion/SKILL.md
    source: superpowers@7.0.2:skills/using-superpowers/SKILL.md
    note: >-
      Its description: "Use when about to claim work is complete, fixed, or passing"; the
      implementation is about to be reported complete.
  - kind: run
    command: npx vitest run
    source: superpowers@7.0.2:skills/test-driven-development/SKILL.md
    note: >-
      "Before you call the change done, run the project's test command". Smallest reading: this
      one full-suite run serves as TDD's Verify GREEN, Spec Kit implement's step 9 "Validate that
      tests pass", task T007 and verification-before-completion's fresh evidence, rather than a
      separate targeted green run before it.

  # /speckit-converge
  - kind: load
    tool: speckit
    path: templates/commands/converge.md
    source: speckit@1.4.3:docs/quickstart.md
    note: /speckit-converge. Its check-prerequisites.sh prints only paths; left out.
  - kind: read
    path: specs/001-payment-terms/spec.md
    source: speckit@1.4.3:templates/commands/converge.md
    note: Step 2, load artifacts. A whole-file read stands in for "only the minimal necessary context".
  - kind: read
    path: specs/001-payment-terms/plan.md
    source: speckit@1.4.3:templates/commands/converge.md
    note: Step 2, load artifacts.
  - kind: read
    path: specs/001-payment-terms/tasks.md
    source: speckit@1.4.3:templates/commands/converge.md
    note: >-
      Step 2, load artifacts. Smallest reading of step 4's code assessment: the files in scope
      (src/terms.ts, src/invoice.ts, src/index.ts, test/terms.test.ts) were all written earlier
      in this session and the suite has just passed, so none is read again. Everything is built,
      so converge reports a clean result and leaves tasks.md unchanged; no write.
