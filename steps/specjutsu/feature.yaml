# feature: add payment terms and dueDate, following specjutsu 0.5.0's own skills:
# sj-propose, then sj-apply, sj-verify and sj-finish, in one session (no specjutsu doc asks for a
# fresh session, so the replay adds the one implicit session step).
steps:
  - kind: write
    path: specjutsu.toml
    source: specjutsu@0.5.0:README.md#L449-L452
    note: >-
      Project setup, not part of the task. The fixture is an existing project with no
      specjutsu.toml, and "`sj adopt` reads an existing one's manifests"; the file it writes for
      the fixture is placed as output, costing no context, and adopt's own output is not counted.
      The `.gitignore` line adopt also adds (`.specjutsu/ledger/`) is not written.
  - kind: run
    command: sj hook claude session-start
    source: specjutsu@0.5.0:crates/sj-adapters/src/claude.rs#L62-L64
    note: >-
      The SessionStart hook the Claude adapter installs; its output goes into the session
      (README.md#L787-L788). Here it prints `specjutsu: no open changes`.
  - kind: run
    command: sj status
    source: specjutsu@0.5.0:crates/sj-adapters/assets/claude/CLAUDE.block.md#L5
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-propose/SKILL.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md
    note: >-
      The task's direction is agreed, which is sj-propose's trigger (its description, line 3).
      sj-explore is skipped: the task leaves nothing vague to explore.
  - kind: run
    command: sj spec new add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L10-L14
    note: >-
      The scaffolded proposal, design and tasks templates are not read: the agent writes each
      file whole from the skill's instructions, the smallest reading.
  - kind: read
    path: src/invoice.ts
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L24
    note: >-
      The proposal's Impact names the code touched, and the design describes the current state;
      the agent reads the invoice module once, here, and keeps it for implementing. Judgement:
      the skill names no files to read; only the two files the change edits are read.
  - kind: read
    path: src/index.ts
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L24
    note: The public exports, which the change extends. Read once, kept for implementing.
  - kind: write
    path: specjutsu/changes/add-payment-terms/proposal.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L19-L26
  - kind: write
    path: specjutsu/changes/add-payment-terms/specs/payment-terms/spec.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L28-L48
  - kind: write
    path: specjutsu/changes/add-payment-terms/design.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L50-L57
    note: The fixture has no specjutsu/principles.md, so there is nothing to check the design against.
  - kind: write
    path: specjutsu/changes/add-payment-terms/tasks.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L59-L75
    note: >-
      One task: the golden code lands as whole files, so the five scenarios are proven in one
      red-green cycle.
  - kind: run
    command: sj spec validate add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L80-L84
  - kind: run
    command: sj spec check add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L80-L85
  - kind: run
    command: sj status add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L87-L89
    note: The proposal is shown to the user from what is already in context; nothing is re-read.
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/SKILL.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md
    note: Implementing the change's tasks is sj-apply's trigger (its description, line 3).
  - kind: run
    command: sj next
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L14-L22
  - kind: write
    path: test/terms.test.ts
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L24-L30
  - kind: run
    command: sj test TERMS-001
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L35-L43
    note: Records red, exit 1 expected (src/terms.ts doesn't exist yet). One run per scenario, as `sj next` prints one `sj test <ID>` per scenario.
  - kind: run
    command: sj test TERMS-002
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L35-L43
    note: Records red, exit 1 expected.
  - kind: run
    command: sj test TERMS-003
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L35-L43
    note: Records red, exit 1 expected.
  - kind: run
    command: sj test TERMS-004
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L35-L43
    note: Records red, exit 1 expected.
  - kind: run
    command: sj test TERMS-005
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L35-L43
    note: Records red, exit 1 expected.
  - kind: write
    path: src/terms.ts
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L47-L49
  - kind: write
    path: src/invoice.ts
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L47-L49
  - kind: write
    path: src/index.ts
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L47-L49
  - kind: run
    command: sj test TERMS-001
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L49-L56
    note: Green. No refactor, so no third run.
  - kind: run
    command: sj test TERMS-002
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L49-L56
  - kind: run
    command: sj test TERMS-003
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L49-L56
  - kind: run
    command: sj test TERMS-004
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L49-L56
  - kind: run
    command: sj test TERMS-005
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L49-L56
  - kind: run
    command: sj task done add-payment-terms 1.1
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L58-L65
    note: >-
      The only task, so the loop ends here without another `sj next`. The skill's commits
      (`test(…): red`, `feat(…): green`) are git commands and put nothing measurable into context.
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-verify/SKILL.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L86
  - kind: run
    command: sj verify
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-verify/SKILL.md#L10-L14
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-finish/SKILL.md
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-finish/SKILL.md
    note: >-
      Landing the finished change is sj-finish's trigger (its description, line 3). Its branch
      and worktree setup, commits, push and PR are git and GitHub steps with no sj output, and
      are left out; sj-review is optional before a PR and is skipped.
  - kind: run
    command: sj verify add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L20-L26
    note: sj-finish runs verify again for the change, as its step 1 says, although sj-verify just ran it.
  - kind: run
    command: sj status add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L27
  - kind: run
    command: sj spec archive add-payment-terms
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L29-L33
  - kind: run
    command: sj spec validate
    source: specjutsu@0.5.0:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L40
