# change: raise the free-shipping threshold to $100.00, following specjutsu 0.5.1's own skills:
# sj-propose, then sj-apply, sj-verify and sj-finish. The main agent is sj-apply's controller.
# sj-apply 0.5.1 starts a new subagent for task 1.1's implementer, a fresh one for its reviewer
# and a fresh one for the whole-change review, so the script declares four sessions: the main
# one and those three. Task 1.2 is a docs task the controller does itself. Each subagent's
# context starts with CLAUDE.md (session.yaml) but not the SessionStart hook, which Claude Code
# runs for the main session only. The prompts the controller writes and the reports the
# subagents send back are agent-written text the replay can't produce, and are not counted on
# either side.
steps:
  # Session 1: the main agent.
  - kind: session
    source: specjutsu@0.5.1:crates/sj-adapters/assets/claude/CLAUDE.block.md
    note: >-
      The task's main session. A script with no session step gets one added by the replay; this
      one declares its subagent sessions, so it declares the first one too.
  - kind: write
    path: specjutsu.toml
    source: specjutsu@0.5.1:README.md#L586-L589
    note: >-
      Project setup, not part of the task. The fixture is an existing project with no
      specjutsu.toml, and "`sj adopt` reads an existing one's manifests"; the file it writes for
      the fixture is placed as output, costing no context, and adopt's own output is not counted.
      The `.gitignore` line adopt also adds (`.specjutsu/ledger/`) is not written.
  - kind: run
    command: sj hook claude session-start
    source: specjutsu@0.5.1:crates/sj-adapters/src/claude.rs#L101-L103
    note: >-
      The SessionStart hook the Claude adapter installs; its output goes into the session
      (README.md#L1030-L1031). Here it prints `specjutsu: no open changes`.
  - kind: run
    command: sj status
    source: specjutsu@0.5.1:crates/sj-adapters/assets/claude/CLAUDE.block.md#L6
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-propose/SKILL.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md
    note: >-
      The task's direction is agreed, which is sj-propose's trigger (its description, line 3).
      sj-explore is skipped: the task leaves nothing vague to explore.
  - kind: run
    command: sj spec new raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L10-L14
    note: >-
      The scaffolded proposal, design and tasks templates are not read: the agent writes each
      file whole from the skill's instructions, the smallest reading.
  - kind: read
    path: src/invoice.ts
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L24
    note: >-
      The proposal's Impact names the code touched. Judgement: the skill names no files to read;
      only the three files the change edits are read. The implementer is a fresh subagent and
      reads its two again.
  - kind: read
    path: test/invoice.test.ts
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L24
    note: The shipping tests the change updates.
  - kind: read
    path: README.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L24
    note: The README states the threshold and the change updates it. Read once, kept for the docs task.
  - kind: write
    path: specjutsu/changes/raise-free-shipping-threshold/proposal.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L19-L26
  - kind: write
    path: specjutsu/changes/raise-free-shipping-threshold/specs/shipping/spec.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L28-L48
    note: >-
      ADDED, not MODIFIED: the start state has no specs, so there is no current requirement to
      copy. Exactly $100.00 ships free before and after the change, so SHIP-002 is a `[keep]`
      scenario, the sj-debug form for behaviour that must not change.
  - kind: write
    path: specjutsu/changes/raise-free-shipping-threshold/design.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L50-L57
    note: The fixture has no specjutsu/principles.md, so there is nothing to check the design against.
  - kind: write
    path: specjutsu/changes/raise-free-shipping-threshold/tasks.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L59-L75
    note: Drafting tasks.md in a subagent is optional (lines 77-78) and not done.
  - kind: run
    command: sj spec validate raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L80-L84
  - kind: run
    command: sj spec check raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L80-L85
  - kind: run
    command: sj status raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-propose/SKILL.md#L87-L89
    note: The proposal is shown to the user from what is already in context; nothing is re-read.
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/SKILL.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md
    note: Implementing the change's tasks is sj-apply's trigger (its description, line 3).
  - kind: run
    command: sj next raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L18-L27
    note: Task 1.1.
  - kind: run
    command: git rev-parse HEAD
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L20-L23
    note: BASE, the commit before the task, for the reviewer.
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L29-L34
    note: >-
      The controller reads the prompt to fill in its angle brackets. writing-good-tests.md is
      passed by name, not read here: the prompt tells the implementer to read it itself
      (implementer-prompt.md#L19), the smallest reading.

  # Session 2: the implementer subagent, task 1.1.
  - kind: session
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L29-L34
    note: '"Start a new subagent with `implementer-prompt.md`, `writing-good-tests.md`, the `sj next` output".'
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L31
    note: >-
      The filled prompt is the subagent's first message. The whole file is counted, though only
      the part after its `---` line is sent: a load step counts whole files.
  - kind: run
    command: sj next raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L8-L11
    note: >-
      The controller pastes its `sj next` output into the prompt. The replay counts those bytes
      by running the same command again, before anything has changed, so it prints the same text.
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/writing-good-tests.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L19
    note: '"Read `writing-good-tests.md` first."'
  - kind: read
    path: test/invoice.test.ts
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L19-L24
    note: A fresh subagent reads the files it edits; only those two.
  - kind: read
    path: src/invoice.ts
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L29
  - kind: write
    path: test/invoice.test.ts
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L19-L24
  - kind: run
    command: sj test SHIP-001
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L25-L28
    note: >-
      Records red, exit 1 expected ($99.99 and $50.00 still ship free). One run per scenario, as
      `sj next` prints one `sj test <ID>` per scenario. The commits (`test(…): red`,
      `feat(…): green`) are git commands the replay does not run.
  - kind: run
    command: sj test SHIP-002
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/writing-good-tests.md#L27-L29
    note: >-
      Exit 0: SHIP-002 is a `[keep]` scenario, which passes before the change. The prompt's "If
      it passes, stop and report `NEEDS_CONTEXT`" (line 27) is for a test that should fail;
      writing-good-tests.md says behaviour that exists and must stay belongs in a `[keep]`
      scenario, which this already is, so the implementer goes on.
  - kind: run
    command: sj test SHIP-003
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L25-L28
    note: Records red, exit 1 expected ($96.90 after discount still ships free).
  - kind: write
    path: src/invoice.ts
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L29
  - kind: run
    command: sj test SHIP-001
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L29-L30
    note: Green. No refactor, so no runs for line 31.
  - kind: run
    command: sj test SHIP-002
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L29-L30
  - kind: run
    command: sj test SHIP-003
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L29-L30
  - kind: run
    command: sj test .
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L29-L30
    note: '"Then run the package''s tests to check nothing else broke": `sj test <package>`; the fixture''s one package is `.`.'
  - kind: run
    command: git diff -- src test
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/implementer-prompt.md#L32-L33
    note: >-
      "Read your own diff once." The replay makes no commits, so the task's diff (`BASE..HEAD`
      once committed) is the working tree's diff of the files the task wrote.

  # Session 3: the task's fresh reviewer subagent. The controller fills its prompt first.
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/task-reviewer-prompt.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L43-L52
    note: >-
      In the controller, after the implementer reports `DONE`: the prompt it fills in. The
      `DONE` report itself is agent-written and not counted.
  - kind: session
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L43-L46
    note: '"Every task gets a reviewer that has never seen the implementer''s work or reasoning. Start a new subagent".'
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-apply/task-reviewer-prompt.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L46
    note: The filled prompt is the subagent's first message; the whole file is counted.
  - kind: run
    command: sj next raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L48
    note: >-
      "the scenario text from `sj next`", pasted into the prompt. No `sj` command prints only the
      scenarios, so the replay runs `sj next` again and counts its whole output, with its files
      and run lines: more than the scenarios alone, never less. Task 1.1 is still the next task.
  - kind: run
    command: git diff -- src test
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/task-reviewer-prompt.md#L20-L28
    note: >-
      `git diff <BASE>..<HEAD>`, as the task's working-tree diff (the replay makes no commits).
      `git log --oneline <BASE>..<HEAD>` would list the task's two commits; with no commits it
      prints nothing, so it is left out. No file is opened beyond the diff: that is only "when
      the diff alone doesn't show enough context" (line 29), and the fixture has no
      specjutsu/principles.md to read.
  - kind: run
    command: sj verify raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/task-reviewer-prompt.md#L22-L26
    note: The reviewer runs it itself, then answers `APPROVED` (not counted).

  # Back in the controller (session 1).
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-verify/SKILL.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-verify/SKILL.md#L3
    note: >-
      "when a subagent reports success" (sj-verify's description): the reviewer's `APPROVED`.
      Loaded here, once, it also covers the "continue with `sj-verify`" at the end of sj-apply.
      Its section 3 asks for the subagent's diff or "`git log` for its commits"; the smallest,
      the commit list, is empty in a replay with no commits, so nothing is counted for it.
  - kind: run
    command: sj verify raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L72-L81
    note: The controller's own evidence before closing the task (also sj-verify#L56-L64).
  - kind: run
    command: sj task done raise-free-shipping-threshold 1.1
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L76-L79
  - kind: run
    command: sj next raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L18-L27
    note: The loop's next task, 1.2, the README (no-scenario).
  - kind: run
    command: git rev-parse HEAD
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L20-L23
    note: >-
      Step 1 runs it for every task. No reviewer uses it this time, but the step does not make
      it conditional, so it is kept.
  - kind: write
    path: README.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L96-L99
    note: >-
      "Do it, or dispatch it, without the test steps." The controller does it: the README is
      already in its context, so no subagent is started, the smallest reading. It changes only
      docs, so it gets no review (line 99).
  - kind: run
    command: sj verify raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L72-L81
    note: >-
      Step 5's evidence check before `sj task done`, kept for the docs task too: only its
      "after `APPROVED`" has no review to wait for.
  - kind: run
    command: sj task done raise-free-shipping-threshold 1.2
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L76-L79
    note: The last task, so the loop ends without another `sj next`.

  # Session 4: the whole-change review in a fresh subagent.
  - kind: session
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L101-L104
    note: '"When every task is done, start a fresh subagent with `sj-review` over the whole change".'
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-review/SKILL.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-apply/SKILL.md#L103
  - kind: run
    command: sj status raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L13-L17
  - kind: run
    command: sj verify raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L13-L17
  - kind: run
    command: git add -N specjutsu && git diff --stat -- README.md specjutsu src test
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L13-L17
    note: >-
      `git diff <base>...HEAD --stat`, as the working tree's diff of every file the change
      wrote, new files marked with `git add -N` so they show (the replay makes no commits). The
      ledger under `.specjutsu/` is left out, as the `.gitignore` line `sj adopt` adds would
      leave it out.
  - kind: read
    path: specjutsu/changes/raise-free-shipping-threshold/proposal.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L19-L20
  - kind: read
    path: specjutsu/changes/raise-free-shipping-threshold/design.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L19-L20
  - kind: read
    path: specjutsu/changes/raise-free-shipping-threshold/specs/shipping/spec.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L19-L20
    note: >-
      The scenarios the change adds. `sj next` shows them per task, but with every task done it
      prints `next: no open tasks`, so the delta spec is read.
  - kind: run
    command: git diff -- README.md src test
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-review/SKILL.md#L19-L20
    note: >-
      "and the diff": the code and docs part of the change. The change folder's own files were
      just read whole, so their diff is not counted again. The fixture has no principles.md,
      the review finds nothing, and its report is not counted.

  # Back in the controller (session 1).
  - kind: run
    command: sj verify
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-verify/SKILL.md#L26-L30
    note: '"Then continue with `sj-verify`" (sj-apply#L106), already loaded above.'
  - kind: load
    tool: specjutsu
    path: crates/sj-adapters/assets/skills/sj-finish/SKILL.md
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-finish/SKILL.md
    note: >-
      Landing the finished change is sj-finish's trigger (its description, line 3). Its branch
      and worktree setup, commits, push and PR are git and GitHub steps with no sj output, and
      are left out. sj-review, which its description ties to "before asking for a PR review",
      already ran as sj-apply's final review, so it is not run again.
  - kind: run
    command: sj verify raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L20-L26
    note: sj-finish runs verify again for the change, as its step 1 says, although sj-verify just ran it.
  - kind: run
    command: sj status raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L27
  - kind: run
    command: sj spec archive raise-free-shipping-threshold
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L29-L33
  - kind: run
    command: sj spec validate
    source: specjutsu@0.5.1:crates/sj-adapters/assets/skills/sj-finish/SKILL.md#L40
